name: pdf-qr-code-extractor
description: QR-focused PDF scanner for Anaconda Enterprise

commands:
  default:
    unix: python main.py
    supports_http_options: true

dependencies:
  - python=3.10
  - pip:
      - Flask
      - PyMuPDF
      - opencv-python-headless
      - numpy

platforms:
  - linux-64
