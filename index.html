<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ORB OOO Schedule</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f9;
            color: #222;
        }

        .container {
            width: 420px;
            margin: 80px auto;
        }

        .title {
            font-size: 21px;
            font-weight: 600;
            color: #0072ce;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .upload-box {
            background: white;
            border: 2px dashed #0072ce;
            border-radius: 10px;
            padding: 28px 22px;
            text-align: center;
            cursor: pointer;
        }

        .upload-box:hover {
            background: #f4faff;
        }

        .upload-text {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .upload-info {
            font-size: 12px;
            color: #777;
            line-height: 1.5;
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            margin-top: 14px;
            font-size: 12px;
            color: #0072ce;
            font-weight: 600;
        }

        .error {
            margin-top: 18px;
            padding: 12px;
            background: #fff1f1;
            border-left: 4px solid #d71920;
            color: #b00000;
            font-size: 13px;
        }

        .processing {
            margin-top: 15px;
            font-size: 13px;
            color: #0072ce;
            display: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="title">
        ORB OOO Schedule
    </div>

    <div class="subtitle">
        Upload the OOO input file to automatically generate the weekly schedule.
    </div>


    <form
        id="uploadForm"
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
    >

        <label
            class="upload-box"
            for="file"
        >

            <div class="upload-text">
                Upload Excel File
            </div>

            <div class="upload-info">
                Input must contain only:
                <br>
                <b>Date</b> &nbsp; | &nbsp;
                <b>Status</b> &nbsp; | &nbsp;
                <b>Employee Name</b>
                <br><br>
                The report will be generated automatically.
            </div>

            <input
                type="file"
                id="file"
                name="file"
                accept=".xlsx,.xls"
            >

            <div
                id="fileName"
                class="file-name"
            ></div>

        </label>

        <div
            id="processing"
            class="processing"
        >
            Generating ORB schedule...
        </div>

    </form>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

</div>


<script>

    const fileInput =
        document.getElementById("file");

    const form =
        document.getElementById("uploadForm");

    const fileName =
        document.getElementById("fileName");

    const processing =
        document.getElementById("processing");


    fileInput.addEventListener(
        "change",
        function () {

            if (
                this.files &&
                this.files.length > 0
            ) {

                fileName.textContent =
                    this.files[0].name;

                processing.style.display =
                    "block";

                // Automatically submit
                // after file selection

                setTimeout(
                    function () {
                        form.submit();
                    },
                    300
                );
            }

        }
    );

</script>

</body>

</html>
